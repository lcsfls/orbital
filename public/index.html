<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbital</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Signed out: setup or sign in -->
<div class="auth" id="auth" hidden></div>

<!-- First-run setup -->
<div class="auth" id="onboard" hidden></div>

<!-- Signed in -->
<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="me">
      <button class="orbit-btn" id="orbitBtn" type="button" data-act="room" aria-describedby="orbitTip">
        <span id="orbitSlot"></span>
        <span class="tip" id="orbitTip" role="tooltip"></span>
      </button>
      <button class="me-text me-link" type="button" data-act="room" title="Open the living room">
        <div class="me-level" id="levelLabel">Level 1</div>
        <div class="xp" role="progressbar" aria-label="Progress to the next level" aria-valuemin="0" aria-valuemax="100" id="xpBar"><span></span></div>
        <div class="me-streak" id="streakLabel"></div>
      </button>
    </div>
    <nav class="nav" aria-label="Main">
      <a href="#today" data-tab="today"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</a>
      <a href="#todo" data-tab="todo"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l2 2 3-3"/><path d="M12 7h8"/><path d="M4 13l2 2 3-3"/><path d="M12 14h8"/><path d="M12 20h8"/><circle cx="6" cy="20" r="1.2"/></svg>To-do</a>
      <a href="#scratch" data-tab="scratch" title="Ctrl+Shift+N"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/></svg>Scratch<span class="dot" id="scratchDot" hidden></span></a>
      <a href="#ideas" data-tab="ideas"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Ideas</a>
      <a href="#projects" data-tab="projects"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16v12H4z"/><path d="M9 7V5h6v2"/><path d="M8 13l2.5 2.5L16 10"/></svg>Projects</a>
      <a href="#home" data-tab="home" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg>Home</a>
    </nav>
    <div class="side-foot">
      <div class="who" id="whoLabel"></div>
      <nav class="nav" aria-label="More">
        <a href="#guide" data-tab="guide"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>Guide</a>
        <a href="#settings" data-tab="settings"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</a>
      </nav>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"></dialog>
<dialog class="modal" id="modal" aria-labelledby="modalTitle"></dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="app.js"></script>
</body>
</html>
